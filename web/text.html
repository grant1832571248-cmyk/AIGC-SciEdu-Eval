<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文本裁判 | 科学教育 AIGC 评估</title>
    <link rel="stylesheet" href="/web/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="tech-page">
    <div class="tech-bg-grid"></div>
    <div class="tech-bg-scanline"></div>
    <div class="tech-bg-noise"></div>
    <canvas id="particleLayer" class="tech-bg-particles" aria-hidden="true"></canvas>
    <div class="tech-orbit-ring" style="top: 8%; left: -100px;"></div>
    <div class="tech-orbit-ring" style="bottom: -120px; right: -120px; animation-duration: 36s; animation-direction: reverse;"></div>
    <header>
      <h1><i data-lucide="shield-check"></i> 文本裁判系统</h1>
      <p>输入师生问答，由 Qwen 专业模型进行科学事实与逻辑的严苛评估</p>
      <nav>
        <a class="tab" href="./index.html"><i data-lucide="home"></i> 首页</a>
        <a class="tab" href="/web/image.html"><i data-lucide="layout-dashboard"></i> 图像裁判</a>
        <a class="tab" href="/web/text.html" aria-current="page"><i data-lucide="file-text"></i> 文本裁判</a>
        <a class="tab" href="/web/video.html"><i data-lucide="video"></i> 视频裁判</a>
      </nav>
    </header>

    <main>
      <section class="card animate-in">
        <h2 class="section-title"><i data-lucide="edit-3"></i> 输入评估内容</h2>
        <div class="grid">
          <div>
            <label for="question">科学问题 / 指令</label>
            <textarea id="question" rows="5" placeholder="例如：1.11 和 1.9 哪个大？并解释原因。"></textarea>
          </div>
          <div>
            <label for="aiAnswer">AI 生成的内容</label>
            <textarea id="aiAnswer" rows="5" placeholder="例如：1.11 更大，因为 11 比 9 大。"></textarea>
          </div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
          <div>
            <label for="subject">评估科目 (可选)</label>
            <select id="subject" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
              <option value="">-- 请选择科目 --</option>
              <option value="科学">科学</option>
              <option value="物理">物理</option>
              <option value="化学">化学</option>
              <option value="生物">生物</option>
              <option value="地理">地理</option>
              <option value="信息技术">信息技术</option>
            </select>
          </div>
          <div>
            <label for="grade">目标学段 (可选)</label>
            <select id="grade" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);">
              <option value="">-- 请选择学段 --</option>
              <option value="小学低年级">小学低年级 (1-3年级)</option>
              <option value="小学高年级">小学高年级 (4-6年级)</option>
              <option value="初中">初中</option>
              <option value="高中">高中</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:20px; justify-content: flex-end; gap: 10px;">
          <button id="btnEval" class="primary-btn" style="background: var(--primary); color: white; padding: 12px 28px; border-radius: 10px; border: none; cursor: pointer; font-weight: 700; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="search"></i> 开始文本评估
          </button>
        </div>
        <div id="status" class="muted" style="margin-top:12px; text-align: right;"></div>
        <div id="error" class="error" style="margin-top:12px; text-align: right; font-weight: 500;"></div>
      </section>

      <section id="resultArea" style="display:none;">
        <div class="grid">
          <section class="card animate-in delay-1">
            <h3 class="section-title"><i data-lucide="activity"></i> 综合评分与点评</h3>
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
              <div class="score-badge" id="scoreDisplay" style="margin: 0;">0</div>
              <div>
                <div id="qualityLabel" class="badge">未知</div>
                <div class="muted" style="margin-top: 4px;">1-10 综合评分</div>
              </div>
            </div>
            <h4 style="font-size: 14px; margin-bottom: 8px; color: var(--muted);">判定理由 / 综合点评</h4>
            <p id="rationaleText" style="font-size: 14px; line-height: 1.6; color: #334155; margin-bottom: 20px;"></p>
            <h4 style="font-size: 14px; margin-bottom: 8px; color: var(--muted);">核心错误</h4>
            <div id="errorTypes" class="row" style="margin-bottom: 16px;"></div>
          </section>

          <section class="card animate-in delay-2">
            <h3 class="section-title"><i data-lucide="hexagon"></i> 多维度雷达图</h3>
            <div style="position: relative; width: 100%; height: 300px;">
              <canvas id="radarChart"></canvas>
            </div>
          </section>
        </div>

        <section class="card animate-in delay-3" style="margin-top: 20px;">
          <h3 class="section-title"><i data-lucide="bar-chart-2"></i> 维度详情柱状图</h3>
          <div style="position: relative; width: 100%; height: 250px;">
            <canvas id="barChart"></canvas>
          </div>
          <details style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px;">
            <summary class="muted" style="cursor: pointer;">查看原始模型响应 (JSON)</summary>
            <pre id="raw" style="background: #f8fafc; padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 200px; margin-top: 10px; border: 1px solid var(--border);"></pre>
          </details>
        </section>
      </section>
    </main>

    <script src="/web/js/app_text.js"></script>
    <script>
      /**
       * 初始化低干扰粒子背景，保持科技感但不影响阅读与操作。
       * Why: 统一首页与业务页视觉语言，避免花哨动效干扰任务流。
       */
      function initSubtleParticles() {
        try {
          const canvas = document.getElementById("particleLayer");
          if (!(canvas instanceof HTMLCanvasElement)) {
            return;
          }

          const ctx = canvas.getContext("2d");
          if (!ctx) {
            return;
          }

          const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          const dpr = Math.min(window.devicePixelRatio || 1, 2);
          const particles = [];
          const targetCount = reducedMotion ? 0 : 26;
          let rafId = 0;

          function resizeCanvas() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            canvas.width = Math.floor(width * dpr);
            canvas.height = Math.floor(height * dpr);
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
          }

          function createParticle() {
            const speedBase = 0.11 + Math.random() * 0.16;
            const angle = Math.random() * Math.PI * 2;
            return {
              x: Math.random() * window.innerWidth,
              y: Math.random() * window.innerHeight,
              vx: Math.cos(angle) * speedBase,
              vy: Math.sin(angle) * speedBase,
              r: 0.8 + Math.random() * 1.6,
              alpha: 0.1 + Math.random() * 0.16,
            };
          }

          function resetParticles() {
            particles.length = 0;
            for (let i = 0; i < targetCount; i += 1) {
              particles.push(createParticle());
            }
          }

          function update() {
            const width = window.innerWidth;
            const height = window.innerHeight;
            ctx.clearRect(0, 0, width, height);

            for (const p of particles) {
              p.x += p.vx;
              p.y += p.vy;

              if (p.x < -20) p.x = width + 20;
              if (p.x > width + 20) p.x = -20;
              if (p.y < -20) p.y = height + 20;
              if (p.y > height + 20) p.y = -20;

              ctx.beginPath();
              ctx.fillStyle = "rgba(59,130,246," + p.alpha.toFixed(3) + ")";
              ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
              ctx.fill();
            }

            rafId = window.requestAnimationFrame(update);
          }

          function handleResize() {
            resizeCanvas();
            if (particles.length === 0 && targetCount > 0) {
              resetParticles();
            }
          }

          resizeCanvas();
          resetParticles();
          update();
          window.addEventListener("resize", handleResize);

          window.addEventListener("beforeunload", () => {
            if (rafId) {
              window.cancelAnimationFrame(rafId);
            }
          });
        } catch (error) {
          // 防御性降级：粒子初始化失败不影响主业务功能。
          console.error("particle layer init failed:", error);
        }
      }

      /**
       * 头部轻微鼠标视差：增强科技感，不影响可读性。
       * Why: 只对伪元素做 1~2px 偏移，提供动态反馈但不花哨。
       */
      function bindHeaderParallax() {
        const header = document.querySelector("header");
        if (!(header instanceof HTMLElement)) {
          return;
        }

        const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        const coarsePointer = window.matchMedia("(pointer: coarse)").matches;
        if (reducedMotion || coarsePointer) {
          return;
        }

        const maxOffsetPx = 2;

        header.addEventListener("mousemove", (event) => {
          const rect = header.getBoundingClientRect();
          if (rect.width <= 0 || rect.height <= 0) {
            return;
          }
          const nx = (event.clientX - rect.left) / rect.width - 0.5;
          const ny = (event.clientY - rect.top) / rect.height - 0.5;
          const ox = nx * maxOffsetPx;
          const oy = ny * maxOffsetPx;
          header.style.setProperty("--header-parallax-x", ox.toFixed(2) + "px");
          header.style.setProperty("--header-parallax-y", oy.toFixed(2) + "px");
        });

        header.addEventListener("mouseleave", () => {
          header.style.setProperty("--header-parallax-x", "0px");
          header.style.setProperty("--header-parallax-y", "0px");
        });
      }

      initSubtleParticles();
      bindHeaderParallax();
      lucide.createIcons();
    </script>
  </body>
</html>
