<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>文本裁判 | 科学教育 AIGC 评估</title>
    <link rel="stylesheet" href="/web/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body class="tech-page">
    <div class="tech-bg-grid"></div>
    <div class="tech-bg-scanline"></div>
    <div class="tech-bg-noise"></div>
    <canvas id="particleLayer" class="tech-bg-particles" aria-hidden="true"></canvas>
    <div class="tech-orbit-ring" style="top: 8%; left: -100px;"></div>
    <div class="tech-orbit-ring" style="bottom: -120px; right: -120px; animation-duration: 36s; animation-direction: reverse;"></div>
    
    <header>
      <h1><i data-lucide="shield-check"></i> 文本裁判系统</h1>
      <p>输入师生问答，由 Qwen 专业模型进行科学事实与逻辑的严苛评估</p>
      <nav>
        <a class="tab" href="./index.html"><i data-lucide="home"></i> 首页</a>
        <a class="tab" href="/web/image.html"><i data-lucide="layout-dashboard"></i> 图像裁判</a>
        <a class="tab" href="/web/text.html" aria-current="page"><i data-lucide="file-text"></i> 文本裁判</a>
        <a class="tab" href="/web/video.html"><i data-lucide="video"></i> 视频裁判</a>
      </nav>
    </header>

    <main>
      <section class="card animate-in shimmer-effect">
        <h2 class="section-title"><i data-lucide="edit-3"></i> 输入评估内容</h2>
        <div class="grid">
          <div>
            <label for="question">科学问题 / 指令</label>
            <textarea id="question" rows="5" placeholder="例如：1.11 和 1.9 哪个大？并解释原因。"></textarea>
          </div>
          <div>
            <label for="aiAnswer">AI 生成的内容</label>
            <textarea id="aiAnswer" rows="5" placeholder="例如：1.11 更大，因为 11 比 9 大。"></textarea>
          </div>
        </div>
        <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;">
          <div>
            <label for="subject">评估科目 (可选)</label>
            <select id="subject">
              <option value="">-- 请选择科目 --</option>
              <option value="physics">物理</option>
              <option value="chemistry">化学</option>
              <option value="biology">生物</option>
              <option value="science">科学</option>
            </select>
          </div>
          <div>
            <label for="grade">目标学段 (可选)</label>
            <select id="grade">
              <option value="">-- 请选择学段 --</option>
              <option value="primary">小学</option>
              <option value="middle">初中</option>
              <option value="high">高中</option>
            </select>
          </div>
        </div>
        <div class="row" style="margin-top:20px; display: flex; justify-content: flex-end; gap: 10px;">
          <button id="btnEval" class="primary-btn">
            <i data-lucide="search"></i> 开始文本评估
          </button>
        </div>
        <div id="status" class="muted" style="margin-top:12px; text-align: right;"></div>
        <div id="error" class="error" style="margin-top:12px; text-align: right; font-weight: 500; color: var(--danger);"></div>
      </section>

      <section id="resultArea" style="display:none;">
        <div class="grid">
          <section class="card report-card animate-in delay-1">
            <h3 class="section-title"><i data-lucide="activity"></i> 综合评分与点评</h3>
            
            <div class="score-circle-container">
              <svg class="score-circle-svg" viewBox="0 0 100 100">
                <circle class="score-circle-bg" cx="50" cy="50" r="45" fill="none"></circle>
                <circle id="scoreProgress" class="score-circle-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283" fill="none"></circle>
              </svg>
              <div class="score-text-container">
                <span id="scoreDisplay" class="score-value">0.0</span>
                <span class="score-label">Total Score</span>
              </div>
            </div>

            <div style="text-align: center; margin-bottom: 20px;">
              <div id="qualityLabel" class="badge">未知</div>
            </div>

            <h4 style="font-size: 14px; margin-bottom: 12px; color: var(--fg-muted);">判定理由 / 综合点评</h4>
            <p id="rationaleText" style="font-size: 14px; line-height: 1.6; color: var(--fg); margin-bottom: 20px;"></p>
            
            <h4 style="font-size: 14px; margin-bottom: 12px; color: var(--fg-muted);">核心建议</h4>
            <div id="suggestionArea"></div>
          </section>

          <section class="card report-card animate-in delay-2">
            <h3 class="section-title"><i data-lucide="hexagon"></i> 多维度评估</h3>
            <div style="position: relative; width: 100%; height: 320px;">
              <canvas id="radarChart"></canvas>
            </div>
            <div id="dimensionTooltips" style="margin-top: 16px; font-size: 12px; color: var(--fg-subtle);">
              * 鼠标悬停在雷达图点上查看维度定义
            </div>
          </section>
        </div>

        <section class="card report-card animate-in delay-3" style="margin-top: 20px;">
          <div class="comparison-header">
            <h3 class="section-title" style="margin-bottom: 0;"><i data-lucide="copy"></i> 结果对比模式</h3>
            <button id="btnToggleCompare" class="tab" style="padding: 6px 16px;">开启历史对比</button>
          </div>
          
          <div id="normalReport">
            <h4 style="font-size: 14px; margin-bottom: 12px; color: var(--fg-muted);">维度详情分析</h4>
            <div style="position: relative; width: 100%; height: 250px;">
              <canvas id="barChart"></canvas>
            </div>
          </div>

          <div id="comparisonArea" style="display: none;" class="comparison-grid">
            <div class="current-result">
              <h4 style="font-size: 13px; color: var(--primary); margin-bottom: 10px;">本次评估结果</h4>
              <div id="currentBrief"></div>
            </div>
            <div class="history-result">
              <h4 style="font-size: 13px; color: var(--fg-subtle); margin-bottom: 10px;">历史平均参考</h4>
              <div id="historyBrief"></div>
            </div>
          </div>

          <details style="margin-top: 20px; border-top: 1px solid var(--border); padding-top: 10px;">
            <summary class="muted" style="cursor: pointer; font-size: 13px;">查看原始模型响应 (JSON)</summary>
            <pre id="raw" style="background: rgba(0,0,0,0.02); padding: 12px; border-radius: 8px; font-size: 12px; overflow: auto; max-height: 200px; margin-top: 10px; border: 1px solid var(--border);"></pre>
          </details>
        </section>
      </section>
    </main>

    <script type="module" src="/web/js/app_text.js"></script>
  </body>
</html>
