<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>科学教育 AIGC 评估系统 - 视频裁判</title>
    <link rel="stylesheet" href="/web/styles.css" />
    <!-- 引入 Chart.js 和 Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="tech-page">
    <div class="tech-bg-grid"></div>
    <div class="tech-bg-scanline"></div>
    <div class="tech-bg-noise"></div>
    <canvas id="particleLayer" class="tech-bg-particles" aria-hidden="true"></canvas>
    <div class="tech-orbit-ring" style="top: 8%; left: -100px;"></div>
    <div class="tech-orbit-ring" style="bottom: -120px; right: -120px; animation-duration: 36s; animation-direction: reverse;"></div>
    <header>
      <h1><i data-lucide="sparkles"></i> 科学教育 AIGC 评估</h1>
      <p>融合 X-CLIP 视频一致性评估系统</p>
      <nav>
        <a class="tab" href="./index.html"><i data-lucide="home"></i> 首页</a>
        <a class="tab" href="/web/image.html"><i data-lucide="layout-dashboard"></i> 图像裁判</a>
        <a class="tab" href="/web/text.html"><i data-lucide="file-text"></i> 文本裁判</a>
        <a class="tab" href="/web/video.html" aria-current="page"><i data-lucide="video"></i> 视频裁判</a>
      </nav>
    </header>

    <main>
      <section class="card animate-in shimmer-effect">
        <h2 class="section-title"><i data-lucide="upload-cloud"></i> 视频内容上传与指令输入</h2>
        <div class="grid">
          <div>
            <label for="prompt">生成指令 (Prompt) / 视频描述</label>
            <textarea id="prompt" rows="4" placeholder="例如：一段展示有丝分裂过程的动画，包含染色体排列和分离的细节"></textarea>
            <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px;">
              <div>
                <label for="subject" style="font-size: 13px;">评估科目 (可选)</label>
                <select id="subject" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;">
                  <option value="">-- 请选择科目 --</option>
                  <option value="physics">物理 (Physics)</option>
                  <option value="chemistry">化学 (Chemistry)</option>
                  <option value="biology">生物 (Biology)</option>
                  <option value="earth">地理 (Earth Science)</option>
                </select>
              </div>
              <div>
                <label for="grade" style="font-size: 13px;">目标学段 (可选)</label>
                <select id="grade" style="width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px;">
                  <option value="">-- 请选择学段 --</option>
                  <option value="小学低年级">小学低年级 (1-3年级)</option>
                  <option value="小学高年级">小学高年级 (4-6年级)</option>
                  <option value="初中">初中</option>
                  <option value="高中">高中</option>
                </select>
              </div>
            </div>
          </div>
          <div>
            <label for="video">生成视频</label>
            <div id="uploadArea" class="upload-area">
              <input id="video" type="file" accept="video/*" style="display: none;" />
              <div id="uploadPlaceholder">
                <i data-lucide="video" style="width: 48px; height: 48px; color: #94a3b8; margin-bottom: 8px;"></i>
                <div class="muted">点击或拖拽视频到此处上传</div>
              </div>
              <div id="previewContainer" style="display:none; margin-top: 10px;">
                <video id="videoPreview" controls style="max-width: 100%; max-height: 200px; border-radius: 8px; box-shadow: var(--shadow-md);"></video>
                <div id="videoMeta" class="preview-info" style="display:none;"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="row" style="margin-top:20px; justify-content: flex-end; gap: 10px;">
          <button id="btnCompare" class="secondary-btn" style="display:none;">
            <i data-lucide="git-compare"></i> 开启对比模式
          </button>
          <button id="btnReport" class="primary-btn">
            <i data-lucide="zap"></i> 生成视频评估报告
          </button>
        </div>
        <div id="status" class="muted" style="margin-top:12px; text-align: right;"></div>
        <div id="error" class="error" style="margin-top:12px; text-align: right; font-weight: 500;"></div>
      </section>

      <!-- 评估报告区域 -->
      <div id="reportArea" style="display:none;">
        <div id="standardView">
          <section class="card report-card animate-in delay-1">
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div>
                <h2 class="section-title" style="margin-bottom: 4px;"><i data-lucide="bar-chart-3"></i> 视频评估报告</h2>
                <p class="muted" id="reportTime"></p>
              </div>
              <div class="score-circle-container">
                <svg class="score-circle-svg" viewBox="0 0 100 100">
                  <circle class="score-circle-bg" cx="50" cy="50" r="45" fill="none"></circle>
                  <circle id="scoreProgress" class="score-circle-progress" cx="50" cy="50" r="45" stroke-dasharray="283" stroke-dashoffset="283" fill="none"></circle>
                </svg>
                <div class="score-text-container">
                  <span id="totalScore" class="score-value">0</span>
                  <span class="score-label">Points</span>
                </div>
              </div>
            </div>

          <hr style="border: 0; border-top: 1px solid var(--border); margin: 24px 0;" />

          <div class="grid" style="align-items: stretch;">
            <div style="min-width: 0;">
              <h3 class="section-title" style="font-size: 16px;"><i data-lucide="check-circle-2"></i> 评估结论</h3>
              <div id="summaryBox" style="padding: 18px; border-radius: var(--radius-md); background: #f8fafc; border: 1px solid var(--border); margin-bottom: 20px; overflow: hidden;">
                <p id="summaryText" style="font-weight: 600; color: #1e293b; margin: 0; word-break: break-word;"></p>
                <div style="margin-top: 12px;">
                  <span id="qualityBadge" class="badge"></span>
                </div>
              </div>
              <div class="metric-grid" style="margin-top: 15px;">
                <div class="metric-item">
                  <div class="muted" style="font-size: 12px; margin-bottom: 4px;">X-CLIP 相似度</div>
                  <div id="xclipSimilarity" style="font-size: 20px; font-weight: 800; color: var(--primary);">-</div>
                </div>
                <div class="metric-item">
                  <div class="muted" style="font-size: 12px; margin-bottom: 4px;">评估模型</div>
                  <div id="modelName" style="font-size: 14px; font-weight: 600;">-</div>
                </div>
              </div>
              <div id="adviceArea" style="display:none; margin-top: 20px; padding: 20px; border-radius: 12px; background: white; border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
                <h4 style="margin: 0 0 12px 0; font-size: 15px; color: var(--primary); display: flex; align-items: center; gap: 6px;">
                  <i data-lucide="lightbulb" style="width: 18px; height: 18px;"></i> Qwen 教学评价与建议
                </h4>
                <div id="adviceSummary" style="font-size: 14px; line-height: 1.6; color: #334155; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--border);"></div>
                <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                  <div>
                    <div style="font-size: 12px; font-weight: 700; color: #059669; margin-bottom: 6px;">亮点分析</div>
                    <ul id="adviceHighlights" style="margin: 0; padding-left: 18px; font-size: 13px; color: #475569;"></ul>
                  </div>
                  <div>
                    <div style="font-size: 12px; font-weight: 700; color: #dc2626; margin-bottom: 6px;">改进空间</div>
                    <ul id="adviceIssues" style="margin: 0; padding-left: 18px; font-size: 13px; color: #475569;"></ul>
                  </div>
                </div>
                <div style="margin-top: 15px; padding-top: 12px; border-top: 1px solid #f1f5f9;">
                  <div style="font-size: 12px; font-weight: 700; color: var(--primary); margin-bottom: 6px;">针对性建议</div>
                  <ul id="adviceSuggestions" style="margin: 0; padding-left: 18px; font-size: 13px; color: #1e293b; font-weight: 500;"></ul>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>

      <!-- 对比模式视图 -->
      <div id="comparisonView" style="display:none;" class="comparison-grid">
        <section class="card animate-in">
          <h3 class="section-title"><i data-lucide="history"></i> 历史平均表现</h3>
          <div class="chart-container">
            <canvas id="historyChart"></canvas>
          </div>
          <div id="historyStats" class="metric-grid" style="margin-top: 20px;"></div>
        </section>
        <section class="card animate-in delay-1">
          <h3 class="section-title"><i data-lucide="trending-up"></i> 本次评估详情</h3>
          <div class="chart-container">
            <canvas id="currentChart"></canvas>
          </div>
          <div id="currentStats" class="metric-grid" style="margin-top: 20px;"></div>
        </section>
      </div>
    </div>
  </main>

  <script type="module" src="/web/js/app_video.js"></script>
</body>
</html>
